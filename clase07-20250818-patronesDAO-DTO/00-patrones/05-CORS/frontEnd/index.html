<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Prueba CORS</h2>
    <hr>
    <div id="datos"></div>
    <br>
    <button id="btnDatos">Obtener Datos</button>

    <script>
        const divDatos=document.getElementById("datos")
        const btnDatos=document.getElementById("btnDatos")

        btnDatos.addEventListener("click", async(e)=>{
            e.preventDefault()

            try {
                let response=await fetch("http://localhost:3000/datos")
                let datos=await response.json()

                if(response.status>=400){
                    divDatos.textContent=`Error al obtener datos`
                }else{
                    divDatos.textContent=datos.payload
                }
            } catch (error) {
                divDatos.textContent=`Error al obtener datos`
            }
        })
    </script>
</body>
</html>
